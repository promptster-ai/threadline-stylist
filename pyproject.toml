[project]
name = "threadline-stylist"
version = "0.1.0"
description = "Threadline AI Stylist — outfit recommender assessment"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
